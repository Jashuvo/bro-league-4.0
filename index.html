<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./manifest-icon-192.png" />

    <!-- PWA Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="title" content="BRO League 5 - Fantasy Premier League" />
    <meta name="description" content="BRO League 5 - Fantasy Premier League competition with live standings, prizes, and stats." />

    <!-- PWA App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BRO League 5" />
    <meta name="application-name" content="BRO League 5" />

    <!-- PWA Theme Colors (match the `surface` token in tailwind.config.js) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff6ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="theme-color" content="#fff6ec" />
    <meta name="msapplication-navbutton-color" content="#7250f5" />
    <meta name="msapplication-TileColor" content="#7250f5" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="./apple-icon-180.png" />

    <!-- Open Graph / PWA Sharing -->
    <!-- TODO: og:url/twitter:url are still a placeholder — set these to the
         real production domain once this season's Vercel project is live. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-project.vercel.app/" />
    <meta property="og:title" content="BRO League 5 - Fantasy Premier League" />
    <meta property="og:description" content="Fantasy Premier League competition with live standings, prizes, and stats." />
    <meta property="og:image" content="./manifest-icon-512.png" />

    <!-- Twitter/X Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-project.vercel.app/" />
    <meta property="twitter:title" content="BRO League 5 - Fantasy Premier League" />
    <meta property="twitter:description" content="Fantasy Premier League competition with live standings, prizes, and stats." />
    <meta property="twitter:image" content="./manifest-icon-512.png" />
    
    <!-- Performance & SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="preconnect" href="https://fantasy.premierleague.com" />
    <link rel="dns-prefetch" href="https://fantasy.premierleague.com" />

    <!-- Type: Fredoka (display/headings) + Nunito (body). These are named in
         tailwind.config.js's fontFamily; without this link they would fall
         back to system-ui, which is exactly what used to happen with the
         previously-configured-but-never-loaded Inter/Outfit. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet" />

    <title>BRO League 5 - Fantasy Premier League</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
